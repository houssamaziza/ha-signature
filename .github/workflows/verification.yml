# Vérifie chaque modification : installation, typage, tests et construction Cloudflare.
# Au premier passage, enregistre aussi package-lock.json et le SQL des tables (migrations/).
name: Vérification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Chaque étape écrit aussi dans ci.log, publié sur la branche ci-logs (lecture des erreurs).
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm ls next react @opennextjs/cloudflare wrangler prisma @prisma/client @prisma/adapter-d1 zod vitest --depth=0 || true

      - name: Prisma (client + SQL des tables)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          npx prisma generate
          mkdir -p migrations
          if [ ! -s migrations/0001_init.sql ]; then
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > migrations/0001_init.sql
          fi
          cat migrations/0001_init.sql

      - name: Typage
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          npx tsc --noEmit

      - name: Tests
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          npx vitest run

      - name: Construction Cloudflare (OpenNext)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          npx opennextjs-cloudflare build

      - name: Taille du Worker
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci.log") 2>&1
          npx wrangler deploy --dry-run --outdir .bundle | tail -n 20

      - name: Enregistrer package-lock.json et migrations
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json migrations
          if ! git diff --cached --quiet; then
            git commit -m "Verrouillage des dépendances et SQL des tables [skip ci]"
            git push
          fi

      - name: Publier le journal (branche ci-logs)
        if: always()
        run: |
          cp ci.log /tmp/ci.log 2>/dev/null || echo "pas de journal" > /tmp/ci.log
          cd /tmp && rm -rf logsrepo && mkdir logsrepo && cd logsrepo
          git init -q && git checkout -q -b ci-logs
          cp /tmp/ci.log ci.log
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Journal ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
